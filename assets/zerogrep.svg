<?xml version="1.0" encoding="UTF-8"?>
<!-- zerogrep app icon — Concept 1: magnifying glass whose lens is a "0",
     with log lines inside and one highlighted match.
     Flat style, rounded terminals, libadwaita-friendly. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- lens = the digit 0 -->
  <circle cx="52" cy="52" r="36" fill="none" stroke="#241f31" stroke-width="10"/>
  <!-- magnifier handle -->
  <line x1="79.5" y1="79.5" x2="106" y2="106" stroke="#241f31" stroke-width="14" stroke-linecap="round"/>
  <!-- log lines inside the 0 -->
  <line x1="38" y1="38" x2="60" y2="38" stroke="#8a8694" stroke-width="7" stroke-linecap="round"/>
  <line x1="34" y1="52" x2="70" y2="52" stroke="#f5a524" stroke-width="7" stroke-linecap="round"/>
  <line x1="38" y1="66" x2="56" y2="66" stroke="#8a8694" stroke-width="7" stroke-linecap="round"/>
</svg>
