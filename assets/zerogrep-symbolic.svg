<?xml version="1.0" encoding="UTF-8"?>
<!-- zerogrep symbolic icon (monochrome, scales to currentColor context).
     GNOME symbolic: 16x16 viewBox, 16px canvas, 11.5px content area. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="none" stroke="#2e3436">
    <!-- lens = 0 -->
    <circle cx="6.75" cy="6.75" r="4.35" stroke-width="1.4"/>
    <!-- handle -->
    <line x1="10" y1="10" x2="13.4" y2="13.4" stroke-width="1.8" stroke-linecap="round"/>
    <!-- log lines: top/bottom light (via opacity), match emphasized -->
    <line x1="5" y1="5.1" x2="8" y2="5.1" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <line x1="4.6" y1="6.75" x2="8.9" y2="6.75" stroke-width="1" stroke-linecap="round"/>
    <line x1="5" y1="8.4" x2="7.4" y2="8.4" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
